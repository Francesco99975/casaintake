services:
  casaintake:
    container_name: casaintake
    image: casaintake
    restart: unless-stopped
    environment:
      - GO_ENV
      - HOST
      - PORT
      - NTFY
      - NTFY_TOKEN
      - METRICS_SECRET
      - PROMETHEUS
      - RECIPIENT_EMAIL
      - RESEND_API_KEY
      - SESSION_AUTH_KEY
      - SESSION_ENCRYPTION_KEY
      - PASSKEY
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3637/healthcheck",
        ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.casaintake.rule=Host(`casaintake.urx.ink`)
      - traefik.http.routers.casaintake.entrypoints=web,websecure
      - traefik.http.routers.casaintake.service=casaintake
      - traefik.http.services.casaintake.loadbalancer.server.port=3637
      - traefik.http.routers.casaintake.tls=true
      - traefik.http.routers.casaintake.tls.certresolver=letsencrypt
      - traefik.http.routers.casaintake.middlewares=websocket-headers,forwardedheaders
    networks:
      - casaintakenet
      - proxy
      - monitoring
    ports:
      - 3637:3637

networks:
  proxy:
    external: true
  monitoring:
    external: true
  casaintakenet:
    driver: bridge
    external: false
